---
base_dir: runs/log/STID
log_level: INFO
data:
  batch_size: 16
  train_val_test_ratio: [0.7, 0.1, 0.2]
  shuffle: true
  num_workers: 0
  dataset_dir: ../Data2Model/datasets/PEMS-BAY

model:
  input_len: 96
  output_len: 12
  input_dim: 3
  output_dim: 1
  num_nodes: 325
  node_dim: 32
  embed_dim: 32
  num_layer: 3
  if_node: true
  if_T_i_D: true
  if_D_i_W: true
  temp_dim_tid: 32
  temp_dim_diw: 32
  time_of_day_size: 288
  day_of_week_size: 7
  
train:
  max_grad_norm: 5
  base_lr: 0.002
  steps: [1, 50, 80]
  epochs: 100
  weight_decay: 0.0001
  lr_decay_ratio: 0.5
