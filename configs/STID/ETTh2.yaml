---
base_dir: runs/log/STID
log_level: INFO
data:
  batch_size: 16
  train_val_test_ratio: [0.7, 0.1, 0.2]
  shuffle: true
  num_workers: 0
  dataset_dir: ../Data2Model/datasets/ETTh2

model:
  input_len: 96
  output_len: 336
  input_dim: 3
  output_dim: 1
  num_nodes: 7
  node_dim: 8
  embed_dim: 2048
  num_layer: 1
  if_node: true
  if_T_i_D: true
  if_D_i_W: true
  temp_dim_tid: 8
  temp_dim_diw: 8
  time_of_day_size: 24
  day_of_week_size: 7
  
train:
  max_grad_norm: 5
  base_lr: 0.0005
  steps: [1, 3, 5]
  epochs: 100
  weight_decay: 0.0005
  lr_decay_ratio: 0.1
