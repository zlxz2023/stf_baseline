---
base_dir: runs/log/GWNet
log_level: INFO
data:
  batch_size: 16
  train_val_test_ratio: [0.7, 0.1, 0.2]
  shuffle: true
  num_workers: 0
  dataset_dir: ../Data2Model/datasets/KnowAir-YRD
  graph_pkl_filename: ../Data2Model/datasets/KnowAir-YRD/adj_mx.pkl
  randomadj: true
  aptonly: false
  adjtype: doubletransition

model:
  nhid: 32
  input_len: 96
  output_len: 12
  input_dim: 2
  output_dim: 1
  num_nodes: 127
  gcn_bool: true
  adddaptadj: true

train:
  max_grad_norm: 5
  dropout: 0.3
  base_lr: 0.001
  epochs: 100
  weight_decay: 0.0001
