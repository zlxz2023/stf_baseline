---
base_dir: runs/log/STAEformer
log_level: INFO
data:
  batch_size: 8
  train_val_test_ratio: [0.7, 0.1, 0.2]
  shuffle: true
  num_workers: 0
  dataset_dir: ../Data2Model/datasets/ETTh1

model:
  input_len: 96
  output_len: 336
  input_dim: 3
  output_dim: 1
  num_nodes: 7
  steps_per_day: 24
  input_embedding_dim: 24
  tod_embedding_dim: 24
  dow_embedding_dim: 24
  spatial_embedding_dim: 0
  adaptive_embedding_dim: 80
  feed_forward_dim: 256
  num_heads: 4
  num_layers: 3
  
train:
  max_grad_norm: 5
  base_lr: 0.001
  steps: [20, 30]
  epochs: 100
  patience: 30
  weight_decay: 0.0003
  lr_decay_ratio: 0.1
  dropout: 0.1
